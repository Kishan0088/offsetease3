name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build site
        run: npm run build
      - name: Run regression guards
        run: npm run guard
