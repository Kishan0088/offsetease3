# OffsetEase — Netlify config
# Eleventy build. Output goes to _site, which becomes the publish root.
# Redirects live in ./_redirects and are passthrough-copied into _site/ by the
# build (single source of truth); Cloudflare Pages would read the same file.
[build]
  publish = "_site"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
